name: Plugin conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/plugin-conformance.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'thirdparty/**'
      - 'packages/**'
      - 'examples/**'
      - 'tests/**'
      - 'scripts/**'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/plugin-conformance.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'thirdparty/**'
      - 'packages/**'
      - 'examples/**'
      - 'tests/**'
      - 'scripts/**'

permissions:
  contents: read
concurrency:
  group: plugin-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: ${{ matrix.platform }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [linux-x64, windows-x64, macos-arm64, macos-x64]
        profile: [webviews, core, disabled]
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            qt-host: linux
            qt-arch: linux_gcc_64
            node-platform: linux
            node-arch: x64
          - platform: windows-x64
            runner: windows-2022
            qt-host: windows
            qt-arch: win64_msvc2022_64
            node-platform: win
            node-arch: x64
          - platform: macos-arm64
            runner: macos-15
            qt-host: mac
            qt-arch: clang_64
            node-platform: darwin
            node-arch: arm64
          - platform: macos-x64
            runner: macos-15-intel
            qt-host: mac
            qt-arch: clang_64
            node-platform: darwin
            node-arch: x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.10.0'
          host: ${{ matrix.qt-host }}
          arch: ${{ matrix.qt-arch }}
          modules: ${{ matrix.profile == 'webviews' && 'qt5compat qtwebengine qtwebchannel qtpositioning qtserialport' || 'qt5compat' }}
          setup-python: false
          cache: true
      - name: Linux display and WebEngine dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libnss3 libasound2t64 libgbm1 libcups2 libxcb-cursor0 libxkbcommon-x11-0
      - name: Stage verified runtime
        env:
          NODE_PLATFORM: ${{ matrix.node-platform }}
          NODE_ARCH: ${{ matrix.node-arch }}
        run: |
          python -B tests/plugin-ci/test_runtime.py
          python scripts/fetch-plugin-node.py --platform "$NODE_PLATFORM" --arch "$NODE_ARCH" --output ci-runtime
      - name: Configure
        env:
          PLUGIN_PROFILE: ${{ matrix.profile }}
          NODE_ARCH: ${{ matrix.node-arch }}
        run: |
          python - <<'PY'
          import json, os, platform, subprocess, sys
          from pathlib import Path
          profile = os.environ['PLUGIN_PROFILE']
          runtime = json.loads(Path('ci-runtime/runtime.json').read_text())
          node = Path(runtime['node']).as_posix()
          interpreter = Path(sys.executable).as_posix()
          options = ['cmake', '-S', '.', '-B', 'build-plugin-ci', '-G', 'Ninja',
                     '-DCMAKE_BUILD_TYPE=Release', '-DNOTEPADNEXT_BUILD_PLUGIN_TESTS=ON',
                     '-DNOTEPADNEXT_BUNDLED_ZLIB=ON',
                     '-DNOTEPADNEXT_PLUGINS=' + ('OFF' if profile == 'disabled' else 'ON'),
                     '-DNOTEPADNEXT_PLUGIN_WEBVIEWS=' + ('ON' if profile == 'webviews' else 'OFF'),
                     '-DNOTEPADNEXT_TEST_NODE=' + node,
                     '-DNOTEPADNEXT_TEST_PYTHON=' + interpreter,
                     '-DNOTEPADNEXT_PLUGIN_NODE=' + ('' if profile == 'disabled' else node),
                     '-DNOTEPADNEXT_PLUGIN_PYTHON=' + ('' if profile == 'disabled' else interpreter)]
          if platform.system() == 'Darwin':
              options += ['-DCMAKE_OSX_ARCHITECTURES=' + ('x86_64' if os.environ['NODE_ARCH'] == 'x64' else 'arm64'),
                          '-DCMAKE_OSX_DEPLOYMENT_TARGET=13.5']
          subprocess.run(options, check=True)
          PY
      - name: Build
        run: cmake --build build-plugin-ci --parallel 3
      - name: Contract and native application tests
        env:
          NNP_APPLICATION_EXIT_OUTPUT: ${{ github.workspace }}/build-plugin-ci/application-exit-results.json
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s '-screen 0 1920x1080x24' ctest --test-dir build-plugin-ci --output-on-failure --output-junit plugin-tests.xml --parallel 1 --timeout 600
          else
            ctest --test-dir build-plugin-ci --output-on-failure --output-junit plugin-tests.xml --parallel 1 --timeout 600
          fi
      - name: Native test diagnostics
        if: always()
        run: |
          python - <<'PYLOG'
          from pathlib import Path
          for file in sorted(Path('build-plugin-ci').glob('*.qt.txt')):
              lines = file.read_text(encoding='utf-8', errors='replace').splitlines()
              failures = [i for i, line in enumerate(lines) if line.startswith(('FAIL!', 'QFATAL'))]
              if failures:
                  print(file.name)
                  indexes = set()
                  for i in failures:
                      indexes.update(range(max(0, i-1), min(len(lines), i+7)))
                  print('\n'.join(lines[i] for i in sorted(indexes)))
          PYLOG
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: plugin-conformance-${{ matrix.platform }}-${{ matrix.profile }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build-plugin-ci/Testing/Temporary/
            build-plugin-ci/plugin-tests.xml
            build-plugin-ci/application-exit-results.json
            build-plugin-ci/CMakeCache.txt
            build-plugin-ci/*.qt.txt
            ci-runtime/runtime.json
