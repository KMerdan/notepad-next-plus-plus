name: Build plugin-enabled binaries
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
            cmake_arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
            cmake_arch: x86_64
          - os: windows-2022
            platform: win
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: jurplel/install-qt-action@v4
        if: matrix.platform != 'darwin'
        with:
          version: '6.10.0'
          modules: 'qt5compat qtwebengine qtwebchannel qtpositioning qtserialport'
          cache: true
      - uses: jdpurcell/install-qt-action@v5
        if: matrix.platform == 'darwin'
        with:
          version: '6.10.0'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qt5compat qtwebengine qtwebchannel qtpositioning qtserialport'
          cache: true
      - uses: egor-tensin/vs-shell@v2
        if: matrix.platform == 'win'
        with:
          arch: x64
      - uses: repolevedavaj/install-nsis@v1.3.0
        if: matrix.platform == 'win'
        with:
          nsis-version: '3.11'
      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor-dev libcups2-dev libnss3 libasound2t64 libpulse0 libegl1 libxcomposite1 libxdamage1 libxrandr2 libxtst6
      - name: Verify and stage Node runtime
        run: python scripts/fetch-plugin-node.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --output ci-runtime
      - name: Configure plugin-enabled package
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.cmake_arch }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          runtime=json.loads(Path('ci-runtime/runtime.json').read_text())
          options=['cmake','-S','.','-B','build','-G','Ninja','-DCMAKE_BUILD_TYPE=Release',
                   '-DNOTEPADNEXT_PLUGIN_WEBVIEWS=ON','-DNOTEPADNEXT_BUNDLED_ZLIB=ON',
                   '-DNOTEPADNEXT_PLUGIN_NODE='+Path(runtime['node']).as_posix()]
          if os.environ['RELEASE_PLATFORM']=='darwin':
              options+=['-DCMAKE_OSX_ARCHITECTURES='+os.environ['RELEASE_ARCH'],
                        '-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0',
                        '-DNOTEPADNEXT_MACOS_NODE_ARCHIVE='+Path(runtime['archive']).as_posix()]
          subprocess.run(options,check=True)
          PY
      - run: cmake --build build --parallel 3
      - name: macOS package
        if: matrix.platform == 'darwin'
        run: cmake --build build --target dmg
      - name: Windows packages
        if: matrix.platform == 'win'
        run: cmake --build build --target zip installer
      - name: Linux package
        if: matrix.platform == 'linux'
        env:
          EXTRA_PLATFORM_PLUGINS: libqwayland.so
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: cmake --build build --target appimage
      - name: Validate and name release artifacts
        run: python scripts/stage-release-artifacts.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --output release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && matrix.platform == 'darwin'
        with:
          name: package-diagnostics-${{ matrix.arch }}
          path: |
            build/plugin-packages/**/package-record.json
            build/plugin-packages/**/bundle-validation.json
            build/plugin-packages/**/deploy.log
            build/plugin-packages/**/dmg.log
          if-no-files-found: ignore
  release:
    name: Prepare binary Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: release-assets
      - name: Check tag and generate SHA-256 checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/stage-release-artifacts.py --finalize release-assets --tag "$RELEASE_TAG"
      - name: Create draft for final acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "Notepad Next ++ $RELEASE_TAG" --notes-file doc/ReleaseNotes.md
